[package]
name = "ld-mixer"
version = "0.5.0"
edition = "2024"
description = "Unofficial mixer and monitor control for Audient iD interfaces (lD = Linux iD)"
license = "MIT"
repository = "https://github.com/lovebycoma/ldmixer"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
env_logger = "0.11.11"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
log = "0.4.35"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
